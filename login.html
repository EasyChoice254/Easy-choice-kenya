<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Easy Choice Kenya</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h2>EASY CHOICE KENYA</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<section class="services">

    <h2>Member Login</h2>

    <div class="card" style="margin:auto; max-width:400px;">

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required>

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <br><br>

            <button type="submit" class="button">
                Login
            </button>

        </form>

        <p id="message" style="margin-top:20px;"></p>

        <p style="margin-top:20px;">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>

</section>

<footer>
    <p>Easy Choice Kenya</p>
</footer>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    document.getElementById("message").textContent =
    "Login demonstration only. Secure account authentication is not yet connected.";

});
</script>

</body>
</html>
